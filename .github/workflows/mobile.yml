name: Mobile (Flutter)

# ── PR check: fast feedback on every branch ──────────────────────────────────
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mobile-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dart:
              - 'mobile/lib/**'
              - 'mobile/test/**'
              - 'mobile/integration_test/**'
              - 'mobile/pubspec.yaml'
              - 'mobile/pubspec.lock'
              - 'mobile/analysis_options.yaml'
              - '.github/workflows/mobile.yml'

  analyze-and-test:
    name: Analyze & Test
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Generate firebase_options.dart
        run: |
          python3 - << 'PYEOF'
          import json, plistlib, pathlib
          gsf = json.loads(pathlib.Path('mobile/android/app/google-services.json').read_text())
          client = gsf['client'][0]
          android_api_key = client['api_key'][0]['current_key']
          android_app_id = client['client_info']['mobilesdk_app_id']
          sender_id = gsf['project_info']['project_number']
          project_id = gsf['project_info']['project_id']
          storage_bucket = gsf['project_info']['storage_bucket']
          plist = plistlib.loads(pathlib.Path('mobile/ios/Runner/GoogleService-Info.plist').read_bytes())
          ios_api_key = plist['API_KEY']
          ios_app_id = plist['GOOGLE_APP_ID']
          ios_bundle_id = plist['BUNDLE_ID']
          content = f"""// GENERATED FILE — DO NOT EDIT MANUALLY
// Generated in CI from google-services.json and GoogleService-Info.plist

import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
import 'package:flutter/foundation.dart'
    show defaultTargetPlatform, TargetPlatform;

class DefaultFirebaseOptions {{
  static FirebaseOptions get currentPlatform {{
    switch (defaultTargetPlatform) {{
      case TargetPlatform.android:
        return android;
      case TargetPlatform.iOS:
        return ios;
      default:
        throw UnsupportedError(
          'DefaultFirebaseOptions are not supported for this platform.',
        );
    }}
  }}

  static const FirebaseOptions android = FirebaseOptions(
    apiKey: '{android_api_key}',
    appId: '{android_app_id}',
    messagingSenderId: '{sender_id}',
    projectId: '{project_id}',
    storageBucket: '{storage_bucket}',
  );

  static const FirebaseOptions ios = FirebaseOptions(
    apiKey: '{ios_api_key}',
    appId: '{ios_app_id}',
    messagingSenderId: '{sender_id}',
    projectId: '{project_id}',
    storageBucket: '{storage_bucket}',
    iosBundleId: '{ios_bundle_id}',
  );
}}
"""
          pathlib.Path('mobile/lib/firebase_options.dart').write_text(content)
          print('Generated mobile/lib/firebase_options.dart')
          PYEOF

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Code generation
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage-${{ github.sha }}
          path: mobile/coverage/lcov.info
