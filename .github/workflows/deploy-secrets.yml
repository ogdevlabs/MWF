name: Deploy Secrets & Edge Functions

# Runs after merge to main when edge function code or secrets config changes.
# Also available as a manual trigger for environment promotion (dev → prod).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-secrets.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options: [prod, dev]
      dry_run:
        description: 'Dry run (print what would be set, do not write)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-secrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'prod' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── Link Supabase project ───────────────────────────────────────────────
      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF="${{ vars.SUPABASE_PROJECT_REF }}"
          npx supabase link --project-ref "$REF"

      # ── Apply migrations ────────────────────────────────────────────────────
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase db push --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      # ── Push Edge Function secrets ──────────────────────────────────────────
      - name: Push Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PROJECT_REF="${{ vars.SUPABASE_PROJECT_REF }}"
          DRY="${{ inputs.dry_run }}"

          # Build secrets file from GitHub Actions secrets
          cat > /tmp/edge-secrets.env << ENVEOF
          SUPABASE_URL=https://${PROJECT_REF}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON=${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          MUX_TOKEN_ID=${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET=${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SIGNING_SECRET=${{ secrets.MUX_WEBHOOK_SIGNING_SECRET }}
          ENVEOF

          # Strip leading whitespace from heredoc
          sed -i 's/^[[:space:]]*//' /tmp/edge-secrets.env

          if [[ "$DRY" == "true" ]]; then
            echo "[dry-run] Would set secrets from edge-secrets.env"
            cat /tmp/edge-secrets.env | sed 's/=.*/=***/'
          else
            npx supabase secrets set --project-ref "$PROJECT_REF" --env-file /tmp/edge-secrets.env
            echo "✓ Edge Function secrets pushed"
          fi

          rm -f /tmp/edge-secrets.env

      # ── Deploy Edge Functions ───────────────────────────────────────────────
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PROJECT_REF="${{ vars.SUPABASE_PROJECT_REF }}"
          DRY="${{ inputs.dry_run }}"

          for fn in send-fcm mux-webhook revenuecat-webhook projection-refresh; do
            if [[ -d "supabase/functions/$fn" ]]; then
              if [[ "$DRY" == "true" ]]; then
                echo "[dry-run] Would deploy: $fn"
              else
                npx supabase functions deploy "$fn" \
                  --project-ref "$PROJECT_REF" \
                  --no-verify-jwt
                echo "✓ Deployed: $fn"
              fi
            fi
          done

      # ── Register Mux webhook ────────────────────────────────────────────────
      - name: Register Mux webhook
        env:
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
        run: |
          PROJECT_REF="${{ vars.SUPABASE_PROJECT_REF }}"
          DRY="${{ inputs.dry_run }}"
          WEBHOOK_URL="https://${PROJECT_REF}.supabase.co/functions/v1/mux-webhook"

          # Check if already registered
          EXISTING=$(curl -sf \
            -u "${MUX_TOKEN_ID}:${MUX_TOKEN_SECRET}" \
            "https://api.mux.com/video/v1/webhooks" || echo '{"data":[]}')

          ALREADY=$(echo "$EXISTING" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          url = '$WEBHOOK_URL'
          for w in data.get('data', []):
              if w.get('url') == url:
                  print(w['id'])
                  break
          " 2>/dev/null || echo "")

          if [[ -n "$ALREADY" ]]; then
            echo "✓ Mux webhook already registered (id: $ALREADY)"
          elif [[ "$DRY" == "true" ]]; then
            echo "[dry-run] Would register Mux webhook: $WEBHOOK_URL"
          else
            RESP=$(curl -sf \
              -X POST \
              -u "${MUX_TOKEN_ID}:${MUX_TOKEN_SECRET}" \
              -H "Content-Type: application/json" \
              "https://api.mux.com/video/v1/webhooks" \
              -d "{\"url\": \"$WEBHOOK_URL\", \"events\": [\"video.asset.ready\", \"video.asset.errored\"]}")
            ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])" 2>/dev/null || echo "")
            if [[ -n "$ID" ]]; then
              echo "✓ Mux webhook registered (id: $ID)"
            else
              echo "::warning::Mux webhook registration may have failed. Register manually: $WEBHOOK_URL"
            fi
          fi

      # ── Summary ─────────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment || 'prod' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Project ref | ${{ vars.SUPABASE_PROJECT_REF }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Edge Function secrets | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions deployed | send-fcm, mux-webhook, revenuecat-webhook, projection-refresh |" >> $GITHUB_STEP_SUMMARY
          echo "| Mux webhook | ✓ registered |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry run | ${{ inputs.dry_run || 'false' }} |" >> $GITHUB_STEP_SUMMARY
