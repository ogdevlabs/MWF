name: Admin Panel (Next.js)

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Lint
        working-directory: admin
        run: npm run lint

      - name: Type-check
        working-directory: admin
        run: npx tsc --noEmit

      - name: Build
        working-directory: admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID || 'placeholder' }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET || 'placeholder' }}
        run: npm run build
